<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TEVİTOL • Cumhuriyet Balosu 2026</title>
  <meta name="description" content="Animasyonlu dijital davetiye" />
  <meta name="theme-color" content="#8e0000" />
  <style>
    :root{ --bg:#8e0000; --bg2:#5d0000; --paper:#f6f2e9; --text:#f6f2e9; --ratio:0.75; }
    *{ box-sizing:border-box }
    html,body{ min-height:100%; margin:0; font-family: system-ui,-apple-system,Segoe UI,Roboto,Arial; color:var(--text);
      background: radial-gradient(1200px 1200px at 10% 10%, var(--bg), var(--bg2)); background-attachment:fixed; }
    .wrap{ min-height:100vh; min-height:100svh; display:grid; place-items:center; align-content:center; padding:24px 16px; gap:14px }
    /* kart: oranı görselin kendi oranına göre ayarlanır, ekrana sığar */
    .card{ width:min(820px, 92vw, calc(82vh * var(--ratio))); width:min(820px, 92vw, calc(82svh * var(--ratio)));
      aspect-ratio: var(--ratio); position:relative; perspective:1200px; cursor:pointer; outline:none;
      -webkit-tap-highlight-color: transparent; }
    .card:focus-visible .envelope{ box-shadow:0 0 0 4px #ffd3a1, 0 20px 50px rgba(0,0,0,.35) }
    .open.card{ cursor:default }
    /* zarf */
    .envelope{ position:absolute; inset:0; display:grid; place-items:center; border-radius:24px;
      background: linear-gradient(145deg,#b10505,#7a0000); box-shadow:0 20px 50px rgba(0,0,0,.35); overflow:hidden;
      transition: transform .8s cubic-bezier(.2,.7,.2,1), opacity .6s ease; }
    .envelope:before{ content:""; position:absolute; inset:0; opacity:.35; pointer-events:none;
      background:
        linear-gradient(to bottom right, transparent 49.5%, rgba(0,0,0,.15) 50%) top left/50% 50% no-repeat,
        linear-gradient(to bottom left, transparent 49.5%, rgba(0,0,0,.15) 50%) top right/50% 50% no-repeat,
        linear-gradient(to top right, transparent 49.5%, rgba(0,0,0,.15) 50%) bottom left/50% 50% no-repeat,
        linear-gradient(to top left, transparent 49.5%, rgba(0,0,0,.15) 50%) bottom right/50% 50% no-repeat; }
    .seal{ position:absolute; width:120px; height:120px; border-radius:50%; font-size:44px;
      background: radial-gradient(circle at 30% 30%, #ffd3a1, #ffb56b 40%, #d68444 70%, #a25b27);
      box-shadow:0 6px 0 rgba(0,0,0,.25), inset 0 4px 10px rgba(0,0,0,.25);
      display:grid; place-items:center; animation: pulse 2.4s ease-in-out infinite; }
    @keyframes pulse{ 0%,100%{ transform:scale(1) } 50%{ transform:scale(1.05) } }
    .hint{ position:absolute; bottom:18px; left:0; right:0; text-align:center; font-size:14px; opacity:.9 }
    /* davetiye (kağıt) */
    .paper{ position:absolute; inset:0; border-radius:22px; background:var(--paper); box-shadow:0 20px 50px rgba(0,0,0,.35);
      transform: rotateX(14deg) translateY(20px) scale(.98); transform-origin:50% 100%; overflow:hidden; opacity:0;
      transition: transform .9s cubic-bezier(.2,.8,.2,1), opacity .6s ease; }
    .paper img{ width:100%; height:100%; object-fit:contain; display:block }
    /* open state */
    .open .envelope{ transform: translateY(30px) rotateX(-18deg) scale(.96); opacity:0; pointer-events:none }
    .open .paper{ transform: rotateX(0) translateY(0) scale(1); opacity:1 }
    .footer{ text-align:center; opacity:.85; font-size:14px; line-height:1.6; max-width:820px; margin:0 }
    /* müzik aç/kapa */
    .sound{ position:fixed; right:16px; bottom:16px; width:48px; height:48px; border-radius:50%; border:0;
      background:rgba(246,242,233,.92); color:#6b0000; font-size:22px; cursor:pointer;
      box-shadow:0 6px 18px rgba(0,0,0,.3); display:none; place-items:center; }
    .sound.show{ display:grid }
    /* konfeti */
    .confetti{ position:fixed; inset:0; pointer-events:none; overflow:hidden }
    .piece{ position:absolute; width:10px; height:14px; opacity:0; transform: translateY(-20vh) rotate(0);
      animation: fall 2600ms ease-in forwards; }
    @keyframes fall{
      0%{opacity:0; transform: translateY(-20vh) rotate(0deg)}
      8%{opacity:1}
      100%{opacity:1; transform: translateY(110vh) rotate(720deg)}
    }
    .error{
      position:fixed; left:50%; top:16px; transform:translateX(-50%);
      background:#fff; color:#6b0000; padding:10px 14px; border-radius:10px; font-weight:700;
      box-shadow:0 8px 0 rgba(0,0,0,.1), 0 8px 24px rgba(0,0,0,.2); display:none;
    }
    @media (prefers-reduced-motion: reduce){
      .seal{ animation:none }
      .envelope,.paper{ transition: opacity .4s ease }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card" id="card" role="button" tabindex="0" aria-label="Davetiyeyi açmak için dokun">
      <div class="envelope" id="envelope">
        <div class="seal">🇹🇷</div>
        <div class="hint">Açmak için dokun 🎆</div>
      </div>
      <div class="paper" id="paper" aria-hidden="true">
        <img id="inviteImage" src="invitation.jpg?v=10" alt="Cumhuriyet Balosu 2026 Davetiyesi" />
      </div>
    </div>

    <p class="footer">17.30 Akşam Yemeği • 18.00 Fotoğraf Çekimi – Müze &amp; Balkon • 19.00 Slow Dans – Fuaye</p>
  </div>

  <!-- Müzik: aynı klasörde music.mp3 (döngüye uygun vals) -->
  <audio id="bgm" src="music.mp3?v=2" preload="auto" loop playsinline></audio>
  <button class="sound" id="sound" type="button" aria-label="Müziği kapat">🔊</button>

  <div class="confetti" id="confetti"></div>
  <div class="error" id="err">Görsel yüklenemedi: invitation.jpg</div>

  <script>
    const card = document.getElementById('card');
    const paper = document.getElementById('paper');
    const confetti = document.getElementById('confetti');
    const img = document.getElementById('inviteImage');
    const err = document.getElementById('err');
    const bgm = document.getElementById('bgm');
    const soundBtn = document.getElementById('sound');
    const TARGET_VOL = 0.6;
    const reduceMotion = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
    let muted = false;

    // Kartın oranını görselin oranına eşitle (kırpılma olmasın)
    function fitRatio(){
      if (img.naturalWidth && img.naturalHeight)
        document.documentElement.style.setProperty('--ratio', img.naturalWidth / img.naturalHeight);
    }
    if (img.complete) fitRatio();
    img.addEventListener('load', fitRatio);

    // Görsel yüklenemezse uyarı
    img.addEventListener('error', () => { err.style.display = 'block'; });

    // Konfeti
    function confettiBurst(){
      if (reduceMotion) return;
      confetti.innerHTML = "";
      const colors = ['#f6f2e9','#ffe5c7','#ffd8b0','#ffffff','#ffb48a'];
      const reds = ['#8e0000','#a00000','#c10000','#6e0000'];
      for(let i=0;i<150;i++){
        const piece = document.createElement('div');
        piece.className = 'piece';
        const size = Math.random()*8+6;
        piece.style.left = Math.random()*100+'vw';
        piece.style.width = size+'px';
        piece.style.height = size*1.4+'px';
        piece.style.background = Math.random()>.45
          ? colors[Math.floor(Math.random()*colors.length)]
          : reds[Math.floor(Math.random()*reds.length)];
        piece.style.animationDelay = Math.random()*400+'ms';
        confetti.appendChild(piece);
      }
      setTimeout(()=> confetti.innerHTML = "", 4000);
    }

    // Müziği yavaşça aç (iOS volume'u yok sayar; orada direkt çalar)
    function fadeIn(){
      bgm.volume = 0;
      const start = performance.now();
      (function step(now){
        const k = Math.min(1, (now - start) / 2500);
        bgm.volume = TARGET_VOL * k;
        if (k < 1 && !bgm.paused) requestAnimationFrame(step);
      })(start);
    }
    async function playMusic(){
      try { await bgm.play(); fadeIn(); } catch(e) { /* tarayıcı izin vermezse sessiz geçer */ }
    }

    function setMuted(m){
      muted = m;
      if (muted) bgm.pause(); else playMusic();
      soundBtn.textContent = muted ? '🔇' : '🔊';
      soundBtn.setAttribute('aria-label', muted ? 'Müziği aç' : 'Müziği kapat');
    }
    soundBtn.addEventListener('click', () => setMuted(!muted));

    // Açma + müzik
    function openInvite(){
      if (card.classList.contains('open')) return;
      card.classList.add('open');
      card.removeAttribute('role');
      card.setAttribute('aria-label', 'Davetiye');
      paper.removeAttribute('aria-hidden');
      soundBtn.classList.add('show');
      confettiBurst();
      playMusic();
    }

    // Sekme arka plana geçince müziği durdur, dönünce devam et
    document.addEventListener('visibilitychange', () => {
      if (!card.classList.contains('open') || muted) return;
      if (document.hidden) bgm.pause(); else playMusic();
    });

    // SADECE davetiyeye dokununca çalışır
    card.addEventListener('click', openInvite);
    card.addEventListener('keydown', e => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openInvite(); }
    });
  </script>
</body>
</html>
